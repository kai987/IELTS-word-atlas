<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>詞光 · 日本語版 README バナー</title>
<style>
  * { box-sizing: border-box }
  html,body { margin:0; width:1600px; height:720px; overflow:hidden; background:#f4eddf; color:#1e2640 }
  body { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif }
  .art { position:absolute; left:830px; top:-100px; width:900px; display:grid; grid-template-columns:repeat(4,210px); gap:16px; transform:rotate(-9deg) }
  figure { margin:0; position:relative; aspect-ratio:1; border-radius:17px; overflow:hidden }
  figure img { width:100%; height:100%; object-fit:cover }
  figcaption { position:absolute; bottom:0; width:100%; padding:20px 12px 9px; background:linear-gradient(transparent,#1e264099); color:#fff9ee; font:bold 21px Georgia,serif }
  .fade { position:absolute; inset:0; background:linear-gradient(90deg,#f4eddf 42%,#f4eddfef 49%,transparent 65%) }
  main { position:absolute; left:70px; top:102px; width:850px }
  .brand { display:flex; align-items:center; gap:16px; font-size:33px; font-weight:700; letter-spacing:.04em }
  .brand img { width:42px; height:42px }
  .brand span { font:21px Georgia,serif; letter-spacing:.13em; opacity:.65; margin-left:2px }
  h1 { font-size:67px; font-weight:500; line-height:1.44; letter-spacing:.015em; margin:35px 0 25px }
  h1 em { color:#b95538; font-style:normal }
  .facts { font-size:25px; line-height:1.9; margin:0; color:#4a5163 }
  .tags { display:flex; gap:13px; margin-top:28px }
  .tags span { border:1px solid #1e264020; padding:11px 19px; border-radius:30px; font-size:20px; background:#ffffff99 }
</style>
<div class="art" id="art"></div><div class="fade"></div>
<main>
  <div class="brand"><img src="/favicon.svg" alt="">詞光 <span>WORD ATLAS</span></div>
  <h1>一語に一枚の絵。<br><em>IELTSを、明るく。</em></h1>
  <p class="facts">7,298語 × イラスト × 英米の発音<br>14,596の例文に、日本語の解説を。</p>
  <div class="tags"><span>無料・登録不要</span><span>単語の星図</span><span>日本語・中国語</span></div>
</main>
<script>
  const words=['leisure','window','cake','train','food','abroad','health','envelope','term','performance','litter','arts','worldwide','force','vegan','additional'];
  document.getElementById('art').innerHTML=words.map(w=>`<figure><img src="/atlas/img/${w}.webp" alt="${w}"><figcaption>${w}</figcaption></figure>`).join('');
</script>
</html>
